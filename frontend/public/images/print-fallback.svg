<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Product image coming soon">
  <!-- cream background -->
  <rect width="800" height="800" fill="#EFE6D6"/>
  <!-- subtle sand border inset -->
  <rect x="24" y="24" width="752" height="752" rx="20" fill="none" stroke="#DCCDB4" stroke-width="1.5"/>
  <!-- bordeaux "V" monogram -->
  <text
    x="400" y="460"
    font-family="Georgia, serif"
    font-size="260"
    font-weight="700"
    text-anchor="middle"
    fill="#5B1A26"
    opacity="0.18"
    letter-spacing="-4"
  >V</text>
  <!-- center icon: tshirt silhouette outline -->
  <g transform="translate(400,380)" fill="none" stroke="#5B1A26" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <!-- tshirt body -->
    <path d="M-80,-60 L-130,-110 L-60,-140 L-30,-100 Q0,-80 30,-100 L60,-140 L130,-110 L80,-60 L80,100 L-80,100 Z"/>
  </g>
  <!-- label at bottom -->
  <text
    x="400" y="660"
    font-family="Georgia, serif"
    font-size="22"
    text-anchor="middle"
    fill="#5B1A26"
    opacity="0.45"
    letter-spacing="3"
  >VELORA</text>
</svg>
