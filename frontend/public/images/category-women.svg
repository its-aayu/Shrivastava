<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Women's apparel">
  <rect width="600" height="800" fill="#241016"/>
  <rect width="600" height="800" fill="url(#womenGrad)" opacity="0.7"/>
  <defs>
    <radialGradient id="womenGrad" cx="0.3" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#8C2F39"/>
