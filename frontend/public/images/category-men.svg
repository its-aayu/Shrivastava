<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Men's apparel">
  <rect width="600" height="800" fill="#3E0F18"/>
  <rect width="600" height="800" fill="url(#menGrad)" opacity="0.7"/>
  <defs>
    <linearGradient id="menGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#5B1A26"/>
      <stop offset="100%" stop-color="#241016"/>
    </linearGradient>
  </defs>
  <!-- hoodie silhouette -->
  <g transform="translate(300,370)" fill="#EFE6D6" opacity="0.15" stroke="#C6A15B" stroke-width="2" stroke-linejoin="round">
    <path d="M-130,-140 L-200,-220 L-80,-270 Q0,-200 80,-270 L200,-220 L130,-140 L130,200 L-130,200 Z"/>
    <!-- hood -->
    <path d="M-80,-270 Q0,-310 80,-270 Q60,-200 0,-180 Q-60,-200 -80,-270 Z" fill="#C6A15B" opacity="0.5" stroke="none"/>
  </g>
  <text x="300" y="690" font-family="Georgia,serif" font-size="28" font-weight="700"
    text-anchor="middle" fill="#E7D3A1" letter-spacing="8">MEN</text>
  <text x="300" y="725" font-family="sans-serif" font-size="13"
    text-anchor="middle" fill="#E7D3A1" opacity="0.55" letter-spacing="2">T-SHIRTS · HOODIES · MORE</text>
</svg>
