<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Personalised gifts">
  <rect width="600" height="800" fill="#241016"/>
  <rect width="600" height="800" fill="url(#giftGrad)" opacity="0.7"/>
  <defs>
    <radialGradient id="giftGrad" cx="0.6" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3E0F18"/>
    </radialGradient>
  </defs>
  <!-- gift box -->
  <g transform="translate(300,350)" fill="none" stroke="#C6A15B" stroke-width="2.5" stroke-linejoin="round" opacity="0.75">
    <!-- box body -->
    <rect x="-110" y="-20" width="220" height="160" rx="8" fill="#C6A15B" fill-opacity="0.12" stroke="#C6A15B"/>
    <!-- box lid -->
    <rect x="-120" y="-60" width="240" height="50" rx="8" fill="#C6A15B" fill-opacity="0.18" stroke="#C6A15B"/>
    <!-- ribbon vertical -->
    <line x1="0" y1="-60" x2="0" y2="140" stroke="#E7D3A1" stroke-width="18" stroke-opacity="0.3"/>
    <!-- ribbon horizontal -->
    <line x1="-120" y1="-35" x2="120" y2="-35" stroke="#E7D3A1" stroke-width="18" stroke-opacity="0.3"/>
    <!-- bow -->
    <path d="M-40,-60 Q-60,-110 -20,-100 Q0,-95 0,-60" fill="none" stroke="#E7D3A1" stroke-width="2.5" stroke-opacity="0.8"/>
    <path d="M40,-60 Q60,-110 20,-100 Q0,-95 0,-60" fill="none" stroke="#E7D3A1" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>
  <text x="300" y="690" font-family="Georgia,serif" font-size="28" font-weight="700"
    text-anchor="middle" fill="#E7D3A1" letter-spacing="8">GIFTS</text>
  <text x="300" y="725" font-family="sans-serif" font-size="13"
    text-anchor="middle" fill="#E7D3A1" opacity="0.55" letter-spacing="2">MUGS · FRAMES · KEYCHAINS · MORE</text>
</svg>
