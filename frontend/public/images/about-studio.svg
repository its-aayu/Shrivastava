<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Velora apparel studio">
  <!-- warm background -->
  <rect width="900" height="700" fill="#EFE6D6"/>
  <!-- subtle gold wash -->
  <rect width="900" height="700" fill="url(#studioGrad)" opacity="0.35"/>
  <defs>
    <linearGradient id="studioGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B1A26" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- table surface -->
  <rect x="60" y="440" width="780" height="12" rx="4" fill="#DCCDB4"/>
  <!-- tshirt folded on table -->
  <g transform="translate(200,280)" fill="#5B1A26" opacity="0.75" stroke="#3E0F18" stroke-width="1.5" stroke-linejoin="round">
    <path d="M-140,-80 L-200,-140 L-80,-180 Q0,-130 80,-180 L200,-140 L140,-80 L140,160 L-140,160 Z"/>
  </g>
  <!-- small "V" label on shirt -->
  <text x="200" y="370" font-family="Georgia,serif" font-size="48" font-weight="700"
    text-anchor="middle" fill="#E7D3A1" opacity="0.9">V</text>
  <!-- mug on table -->
  <g transform="translate(620,380)" fill="#F8F2E9" stroke="#DCCDB4" stroke-width="2">
    <rect x="-35" y="-60" width="70" height="80" rx="8"/>
    <path d="M35,-40 Q60,-40 60,-10 Q60,20 35,20" fill="none" stroke="#DCCDB4" stroke-width="2.5"/>
    <!-- mug heart -->
    <path d="M-10,-30 Q-10,-42 0,-42 Q10,-42 10,-30 Q10,-20 0,-12 Q-10,-20 -10,-30 Z" fill="#C6A15B" stroke="none"/>
  </g>
  <!-- frame on wall -->
  <rect x="560" y="80" width="220" height="170" rx="10" fill="#FFFDF9" stroke="#DCCDB4" stroke-width="2"/>
  <rect x="578" y="96" width="184" height="138" rx="6" fill="#EFE6D6"/>
  <text x="670" y="178" font-family="Georgia,serif" font-size="52" font-weight="700"
    text-anchor="middle" fill="#5B1A26" opacity="0.5">V</text>
  <!-- hang wire -->
  <line x1="620" y1="80" x2="590" y2="50" stroke="#DCCDB4" stroke-width="1.5"/>
  <line x1="720" y1="80" x2="750" y2="50" stroke="#DCCDB4" stroke-width="1.5"/>
  <!-- brand name bottom -->
  <text x="450" y="620" font-family="Georgia,serif" font-size="26" font-weight="700"
    text-anchor="middle" fill="#5B1A26" opacity="0.55" letter-spacing="6">VELORA STUDIO</text>
</svg>
