<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B1A26" />
    <title>You're offline — VELORA</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bordeaux: #5B1A26;
        --bordeaux-dark: #3E1019;
        --gold: #C6A15B;
        --cream: #F8F2E9;
        --ivory: #EFE6D6;
        --text: #1A1208;
        --text-muted: #6B5B45;
        --radius: 12px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --cream: #1C1208;
          --ivory: #2A1E10;
          --text: #EFE6D6;
          --text-muted: #B8A882;
        }
      }

      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--cream);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
      }

      .logo-wordmark {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--bordeaux);
        text-transform: uppercase;
      }

      .card {
        background: var(--ivory);
        border: 1px solid rgba(198, 161, 91, 0.3);
        border-radius: var(--radius);
        padding: 40px 32px;
        max-width: 400px;
        width: 100%;
      }

      .icon-wrap {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: rgba(91, 26, 38, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-wrap svg {
        width: 32px;
        height: 32px;
        stroke: var(--bordeaux);
      }

      h1 {
        font-size: 1.375rem;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text);
      }

      p {
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 24px;
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn:hover { opacity: 0.85; }

      .btn--primary {
        background: var(--bordeaux);
        color: #fff;
      }

      .btn--wa {
        background: #25D366;
        color: #fff;
      }

      .btn--ghost {
        background: transparent;
        border: 1.5px solid var(--gold);
        color: var(--bordeaux);
      }

      @media (prefers-color-scheme: dark) {
        .btn--ghost { color: var(--gold); }
      }

      footer {
        margin-top: 40px;
        font-size: 0.8125rem;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="10" fill="#5B1A26"/>
        <rect x="9" y="10" width="30" height="2" rx="1" fill="#C6A15B"/>
        <polygon points="9,14 16,14 24,32 32,14 39,14 26,37 22,37" fill="#EFE6D6"/>
        <rect x="9" y="38" width="30" height="2" rx="1" fill="#C6A15B"/>
      </svg>
      <span class="logo-wordmark">Velora</span>
    </div>

    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7h4l2 9h6l2-9h4"/>
          <circle cx="8.5" cy="20" r="1"/>
          <circle cx="17.5" cy="20" r="1"/>
          <path d="M1 1l4 .5"/>
        </svg>
      </div>

      <h1>You're offline</h1>
      <p>Looks like you've lost your internet connection. You can still reach us on WhatsApp to place or check on an order.</p>

      <div class="btn-group">
        <a href="https://wa.me/915468427200" class="btn btn--wa">

        <a href="/" class="btn btn--ghost">Go to homepage</a>
      </div>
    </div>

    <footer>+91 54684 27200 &nbsp;·&nbsp; admin@velorastudio.in</footer>
  </body>
</html>
